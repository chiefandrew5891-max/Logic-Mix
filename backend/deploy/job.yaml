# Шаблон Cloud Run Job. Ничего не создаёт само: применять вручную после создания проекта владельцем
# (`gcloud run jobs replace job.yaml`). Заменить ${PROJECT_ID}, ${REGION}, ${BUCKET}, ${SERVICE_ACCOUNT}.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: logicmix-content-staging
spec:
  template:
    spec:
      template:
        spec:
          maxRetries: 1
          timeoutSeconds: 3600
          serviceAccountName: ${SERVICE_ACCOUNT}   # отдельный аккаунт; роль — только запись в бакет и чтение источников
          containers:
            - image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/logicmix/content-job:latest
              resources:
                limits: {cpu: "1", memory: 1Gi}
              env:
                - {name: LM_CHANNEL, value: staging}
                - {name: LM_BUCKET, value: ${BUCKET}}
                - {name: LM_LANGS, value: "en,ru"}
                - {name: LM_DATA_VERSION, value: "1"}
                - {name: LM_APPROVE, value: "0"}   # staging: публикация только с явным подтверждением
